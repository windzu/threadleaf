name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: >-
          node -e "const manifest=require('./manifest.json');
          const pkg=require('./package.json');
          const tag=process.env.GITHUB_REF_NAME;
          if(!/^\d+\.\d+\.\d+$/.test(tag)) throw new Error('Release tag must use x.y.z');
          if(manifest.version!==tag) throw new Error('manifest.json version does not match tag');
          if(pkg.version!==tag) throw new Error('package.json version does not match tag');"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
          main.js manifest.json styles.css
